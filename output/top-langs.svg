<svg xmlns="http://www.w3.org/2000/svg" width="350" height="215" viewBox="0 0 350 215" role="img" aria-label="$ cloc --by-lang">
<style>
  text{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
  .t{fill:#A277FF;font-size:16px;font-weight:700}
  .l{fill:#C9D1D9;font-size:13px}
  .v{fill:#61FFCA;font-size:13px;font-weight:700}
  .m{fill:#8B949E;font-size:11px}
  .fade{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
<rect x="0.5" y="0.5" width="349" height="214" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="20" cy="20" r="5" fill="#FF5F56"/><circle cx="36" cy="20" r="5" fill="#FFBD2E"/><circle cx="52" cy="20" r="5" fill="#27C93F"/>
<text x="70" y="25" class="t">$ cloc --by-lang</text>
<clipPath id="bc"><rect x="24" y="46" width="302" height="8" rx="4"/></clipPath>
<g clip-path="url(#bc)"><g style="transform-origin:24px 50px;animation:grow 1s ease-out"><rect x="24.0" y="46" width="156.1" height="8" fill="#3178c6"/><rect x="180.1" y="46" width="73.4" height="8" fill="#663399"/><rect x="253.5" y="46" width="50.9" height="8" fill="#f1e05a"/><rect x="304.4" y="46" width="14.5" height="8" fill="#3572A5"/><rect x="318.9" y="46" width="5.6" height="8" fill="#e34c26"/></g></g>
<g class="fade" style="animation-delay:0ms">
  <circle cx="29" cy="86" r="5" fill="#3178c6"/>
  <text x="40" y="90" class="l">TypeScript <tspan class="m">51.7%</tspan></text>
</g>
<g class="fade" style="animation-delay:100ms">
  <circle cx="189" cy="86" r="5" fill="#663399"/>
  <text x="200" y="90" class="l">CSS <tspan class="m">24.3%</tspan></text>
</g>
<g class="fade" style="animation-delay:200ms">
  <circle cx="29" cy="118" r="5" fill="#f1e05a"/>
  <text x="40" y="122" class="l">JavaScript <tspan class="m">16.9%</tspan></text>
</g>
<g class="fade" style="animation-delay:300ms">
  <circle cx="189" cy="118" r="5" fill="#3572A5"/>
  <text x="200" y="122" class="l">Python <tspan class="m">4.8%</tspan></text>
</g>
<g class="fade" style="animation-delay:400ms">
  <circle cx="29" cy="150" r="5" fill="#e34c26"/>
  <text x="40" y="154" class="l">HTML <tspan class="m">1.8%</tspan></text>
