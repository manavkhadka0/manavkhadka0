<svg xmlns="http://www.w3.org/2000/svg" width="540" height="195" viewBox="0 0 540 195" role="img" aria-label="$ uptime --commits">
<style>
  text{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
  .t{fill:#A277FF;font-size:16px;font-weight:700}
  .l{fill:#C9D1D9;font-size:13px}
  .v{fill:#61FFCA;font-size:13px;font-weight:700}
  .m{fill:#8B949E;font-size:11px}
  .fade{opacity:0;animation:in .6s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
<rect x="0.5" y="0.5" width="539" height="194" rx="10" fill="#0D1117" stroke="#30363D"/>
<circle cx="20" cy="20" r="5" fill="#FF5F56"/><circle cx="36" cy="20" r="5" fill="#FFBD2E"/><circle cx="52" cy="20" r="5" fill="#27C93F"/>
<text x="70" y="25" class="t">$ uptime --commits</text>

<line x1="180" y1="60" x2="180" y2="175" stroke="#30363D"/>
<line x1="360" y1="60" x2="360" y2="175" stroke="#30363D"/>

<g class="fade" style="animation-delay:90ms">
  
  <text x="90" y="112" text-anchor="middle" style="fill:#61FFCA;font-size:30px;font-weight:700">2.3k</text>
  <text x="90" y="150" text-anchor="middle" class="l">Total contributions</text>
  <text x="90" y="170" text-anchor="middle" class="m">Feb 26, 2020 - Present</text>
</g>

<g class="fade" style="animation-delay:270ms">
  <circle cx="270" cy="101" r="38" fill="none" stroke="#A277FF" stroke-width="4" stroke-dasharray="239" stroke-dashoffset="239" style="animation:draw 1.2s ease-out forwards"/>
  <text x="270" y="58" text-anchor="middle" style="font-size:18px;animation:pulse 1.6s ease-in-out infinite">🔥</text>
  <text x="270" y="112" text-anchor="middle" style="fill:#FF6BCB;font-size:30px;font-weight:700">2</text>
  <text x="270" y="150" text-anchor="middle" class="l">Current streak</text>
  <text x="270" y="170" text-anchor="middle" class="m">Sep 24 - Sep 25, 2026</text>
</g>

<g class="fade" style="animation-delay:450ms">
  
  <text x="450" y="112" text-anchor="middle" style="fill:#A277FF;font-size:30px;font-weight:700">22</text>
  <text x="450" y="150" text-anchor="middle" class="l">Longest streak</text>
  <text x="450" y="170" text-anchor="middle" class="m">Mar 23 - Apr 13, 2025</text>
</g>
</svg>